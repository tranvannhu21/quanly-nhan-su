{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Đổi mật khẩu</h2>
    <p>Vui lòng nhập mật khẩu cũ của bạn, sau đó nhập mật khẩu mới hai lần để xác nhận.</p>

    <form method="post">
        {% csrf_token %}
        
        {{ form.as_p }}
        
        <button type="submit" class="btn btn-success mt-2">Xác nhận đổi mật khẩu</button>
    </form>
</div>
{% endblock %}
