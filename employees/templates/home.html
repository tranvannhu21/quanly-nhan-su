{% extends 'base.html' %}

{% block content %}

<div class="container text-center mt-5">

<h1 class="fw-bold mb-3">👨‍💼 Hệ thống quản lý nhân sự</h1>

<p class="lead mb-5">
Website giúp quản lý thông tin nhân viên, chấm công và nghỉ phép.
</p>


<div class="row justify-content-center">

<div class="col-md-3">
<div class="card shadow p-3 mb-4">
<h5>Nhân viên</h5>
<p>Quản lý thông tin nhân viên</p>
<a href="/employees" class="btn btn-primary">Xem</a>
</div>
</div>


<div class="col-md-3">
<div class="card shadow p-3 mb-4">
<h5>Chấm công</h5>
<p>Check-in / Check-out nhân viên</p>
<a href="/attendance" class="btn btn-success">Truy cập</a>
</div>
</div>


<div class="col-md-3">
<div class="card shadow p-3 mb-4">
<h5>Nghỉ phép</h5>
<p>Quản lý đơn xin nghỉ phép</p>
<a href="/leave" class="btn btn-warning">Xem</a>
</div>
</div>

</div>

</div>

<style>
    body {
        /* Ảnh nền văn phòng chất lượng cao từ Unsplash */
        background-image: linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.85)), url('https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=1920&auto=format&fit=crop');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
    }

    .card {
        border: none !important;
        box-shadow: 0 8px 15px rgba(0,0,0,0.1) !important;
        background-color: rgba(255, 255, 255, 0.95) !important; /* Thẻ hơi trong suốt nhẹ */
    }
</style>

{% endblock %}
