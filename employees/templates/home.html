{% extends 'base.html' %}

{% block content %}

<div class="container text-center mt-5">

<h1 class="fw-bold mb-3">👨‍💼 Hệ thống quản lý nhân sự</h1>

<p class="lead mb-5">
Website giúp quản lý thông tin nhân viên, chấm công và nghỉ phép.
</p>


<div class="row justify-content-center">

<div class="col-md-3">
<div class="card shadow p-3 mb-4">
<h5>Nhân viên</h5>
<p>Quản lý thông tin nhân viên</p>
<a href="/employees" class="btn btn-primary">Xem</a>
</div>
</div>


<div class="col-md-3">
<div class="card shadow p-3 mb-4">
<h5>Chấm công</h5>
<p>Check-in / Check-out nhân viên</p>
<a href="/attendance" class="btn btn-success">Truy cập</a>
</div>
</div>


<div class="col-md-3">
<div class="card shadow p-3 mb-4">
<h5>Nghỉ phép</h5>
<p>Quản lý đơn xin nghỉ phép</p>
<a href="/leave" class="btn btn-warning">Xem</a>
</div>
</div>

</div>

</div>

<style>
    /* Đổi màu nền của toàn bộ trang */
    body {
        /* Dải màu gradient từ trắng sang xám nhạt */
        background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        background-attachment: fixed; /* Giữ nền cố định khi cuộn trang */
    }

    /* Đổ bóng nhẹ cho 3 cái thẻ (Card) để chúng nổi bật lên dạng 3D */
    .card {
        border: none !important;
        box-shadow: 0 10px 20px rgba(0,0,0,0.08) !important;
        transition: transform 0.3s ease;
    }

    /* Hiệu ứng khi di chuột vào thẻ */
    .card:hover {
        transform: translateY(-5px);
    }
</style>

{% endblock %}
