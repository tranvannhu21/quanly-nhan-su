{% extends 'base.html' %}

{% block content %}

<h2>Quên mật khẩu</h2>
<p>Vui lòng nhập địa chỉ email tài khoản của bạn. Chúng tôi sẽ gửi cho bạn một liên kết để đặt lại mật khẩu.</p>

<form method="post">
    {% csrf_token %}
    
    <!-- Django sẽ tự động sinh ra ô nhập Email chuẩn ở đây -->
    {{ form.as_p }}
    
    <br>
    <button type="submit" class="btn btn-primary">
        Gửi liên kết
    </button>
</form>

{% endblock %}
