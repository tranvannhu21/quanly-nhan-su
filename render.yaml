services:
  - type: web
    name: quanly-nhan-su
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: bash build.sh
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"